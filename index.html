<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydrogen.ai — Math Worksheet Studio</title>

<!-- Supabase JS Client CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { brand: {
  50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',600:'#7c3aed',700:'#6d28d9',800:'#5b21b6' } } } } }
</script>

<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\\)']], processEscapes: true },
  svg: { fontCache: 'global' }
};
</script>
<script id="MathJax-script" defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

<style>
body { font-family:'Plus Jakarta Sans',sans-serif; color:#0f172a; background:#f8fafc; }
.font-mono { font-family:'JetBrains Mono',monospace; }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:9999px; }
.paper-sheet { background:#fff; border:1px solid #e2e8f0; box-shadow:0 4px 20px -2px rgba(15,23,42,.05); min-height:400px; }
.pre-wrap { white-space:pre-wrap; word-break:break-word; }
mjx-container svg { max-width:100%; }

.q-text { font-family:'Source Serif 4',Georgia,serif; }
.grid-card { background-color:#fbfcfe; background-image:linear-gradient(#e2e8f0 1px,transparent 1px),linear-gradient(90deg,#e2e8f0 1px,transparent 1px); background-size:20px 20px; }
@page { margin:12mm; }
@media print {
  html, body { height:auto !important; overflow:visible !important; background:#fff !important; }
  body { display:block !important; color:#000 !important; }
  .no-print, aside, header, #tutorDrawer, #modalOverlay, #sidebarBackdrop, #authModalOverlay { display:none !important; }
  #workspace, main { height:auto !important; overflow:visible !important; padding:0 !important; display:block !important; }
  .paper-sheet { border:none !important; box-shadow:none !important; padding:0 !important; min-height:0 !important; }
  .problem-item { break-inside:avoid; page-break-inside:avoid; }
  .sol-btn { display:none !important; }
  .solution-box { display:none !important; background:#f8fafc !important; }
  body.print-answers .solution-box { display:block !important; }
}
</style>
</head>
<body class="h-dvh flex overflow-hidden antialiased bg-slate-50">

<div id="sidebarBackdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/40 z-30 hidden md:hidden no-print" aria-hidden="true"></div>

<aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 -translate-x-full md:translate-x-0 transition-transform duration-200 bg-white border-r border-slate-200 flex flex-col justify-between p-4 select-none flex-shrink-0 no-print">
  <div class="space-y-4">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white shadow-sm">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.5" fill="currentColor"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(30 12 12)"/></svg>
      </div>
      <span class="font-bold text-base text-slate-900 tracking-tight">hydrogen<span class="text-brand-600">.ai</span></span>
    </div>

    <button onclick="openModal()" class="w-full flex items-center justify-center space-x-2 py-2 px-4 rounded-xl bg-slate-50 border border-slate-200 hover:bg-slate-100 text-slate-800 font-medium text-xs transition shadow-sm">
      <span class="font-bold text-sm">+</span><span>New worksheet</span>
    </button>

    <!-- Sign In/Out Button in Sidebar -->
    <button id="clerkSignInBtn" onclick="handleClerkAuth()" style="display:block; width:100%; padding:12px 16px; background-color:#31c48d; color:white; font-weight:bold; font-size:14px; border:3px solid #1f7d5e; border-radius:12px; cursor:pointer; margin:8px 0; box-shadow:0 4px 12px rgba(49,196,141,0.4);">
      <span>👤 </span><span id="clerkButtonText">Sign In / Sign Up</span>
    </button>
    
    <p id="clerkUserInfo" style="text-align:center; color:#31c48d; font-size:11px; font-weight:500; margin:0; padding:4px 0;"></p>

    <nav class="space-y-1 pt-2">
      <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 pb-1">Workspace</p>
      <button class="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-brand-50/80 text-brand-700 font-semibold text-xs border border-brand-100">
        <span>📄 Worksheets</span><span class="w-1.5 h-1.5 rounded-full bg-brand-600"></span>
      </button>
      <button onclick="toggleTutor(true); toggleSidebar(false)" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-slate-600 hover:bg-slate-100/80 text-xs transition">
        <span>🤖 AI Tutor</span>
        <span class="text-[9px] bg-brand-100 text-brand-700 px-1.5 py-0.5 rounded-md font-semibold">Active</span>
      </button>
    </nav>
  </div>
</aside>

<div id="workspace" class="flex-1 min-w-0 flex flex-col h-dvh overflow-hidden bg-slate-50/70">
  <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-3 sm:px-6 flex-shrink-0 no-print">
    <div class="flex items-center space-x-2">
      <button onclick="toggleSidebar()" class="md:hidden p-1.5 rounded-md border border-slate-200 text-slate-500">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
      </button>
    </div>
    <div class="flex items-center space-x-1.5 sm:space-x-2">
      <button onclick="toggleTutor()" class="px-2.5 py-1.5 text-xs font-medium rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-50">🤖 AI Tutor</button>
      <button onclick="openModal()" class="px-3 py-1.5 text-xs font-semibold bg-brand-600 text-white rounded-lg hover:bg-brand-700 shadow-sm">+ New</button>
    </div>
  </header>

  <main id="main" class="flex-1 overflow-y-auto px-3 sm:px-8 md:px-14 py-6 sm:py-8 flex flex-col items-center">
    <div class="w-full max-w-3xl space-y-6">
      <div id="printableSheet" class="paper-sheet rounded-2xl p-5 sm:p-12 text-slate-900">
        <div class="border-b border-slate-200 pb-6 mb-8">
          <h1 id="paperTitle" class="text-2xl font-bold text-slate-900 tracking-tight">Untitled</h1>
          <p id="paperGrade" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
        <div id="questionsContainer" class="space-y-8"></div>
      </div>
    </div>
  </main>
</div>

<!-- GitHub Authentication Modal -->
<div id="authModalOverlay" onclick="if(event.target===this) closeAuthModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
  <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
      <h3 class="font-bold text-slate-900 text-base">Sign In to Hydrogen.ai</h3>
      <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
    </div>

    <!-- GitHub OAuth Button -->
    <button type="button" onclick="handleGitHubSignIn()" class="w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs shadow-sm transition">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02_0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      <span>Continue with GitHub</span>
    </button>
  </div>
</div>

<!-- Load scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>

<script>
  function openAuthModal() {
    document.getElementById('authModalOverlay').classList.remove('hidden');
  }

  function closeAuthModal() {
    document.getElementById('authModalOverlay').classList.add('hidden');
  }

  async function handleGitHubSignIn() {
    if (!window.supabaseClient) {
      alert('Supabase client not initialized.');
      return;
    }
    const { error } = await window.supabaseClient.auth.signInWithOAuth({
      provider: 'github',
      options: { redirectTo: window.location.origin }
    });
    if (error) {
      alert('GitHub Sign-In error: ' + error.message);
    }
  }
</script>

<script src="js/diagrams.js"></script>
<script src="js/app.js"></script>
</body>
</html>
